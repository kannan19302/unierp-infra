# ============================================================
# UniERP — the platform, built from the layered polyrepo
# ============================================================
#
#   docker compose -f docker-compose.dev.yml -f docker-compose.platform.yml up -d --build
#
# `docker-compose.dev.yml` brings the shared services this repository owns —
# PostgreSQL, Redis, MinIO. This file adds the platform applications:
#
#   ../unierp-api                L3   the modular monolith (3001)
#   ../unierp-idp                L3   identity provider (3005)
#   ../unierp-web                L4   tenant admin portal (3000)
#   ../unierp-console            L4   platform admin console (3002)
#   ../unierp-corporate-website  L4   corporate marketing website (3003)
#   ../unierp-developer          L4   App Studio & builder portal (3004)
#   ../unierp-mobile             L4   Flutter web mobile client (8080)
#   ../unierp-storybook          L4   UI design system catalog (6006)
# ============================================================

x-registry: &registry
  UNIERP_REGISTRY: https://registry.npmjs.org/

x-datastore-env: &datastore-env
  # The app connects as the NOBYPASSRLS role; migrations run as the owner.
  DATABASE_URL: postgresql://unerp_api:unerp_api_password@postgres:5432/unerp_dev?schema=public
  DATABASE_OWNER_URL: postgresql://unerp:unerp_password@postgres:5432/unerp_dev?schema=public
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000
  S3_ACCESS_KEY: minioadmin
  S3_SECRET_KEY: minioadmin
  S3_BUCKET: unerp-uploads
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-super-secret-key-change-in-production}
  PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}

services:
  api:
    build:
      context: ../unierp-api
      args: *registry
    container_name: unerp-api
    restart: unless-stopped
    environment:
      <<: *datastore-env
      NODE_ENV: development
      API_PORT: "3001"
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
    ports:
      - "3001:3001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  idp:
    build:
      context: ../unierp-idp
      args: *registry
    container_name: unerp-idp
    restart: unless-stopped
    environment:
      <<: *datastore-env
      NODE_ENV: development
      PORT: "3005"
      API_PORT: "3005"
    ports:
      - "3005:3005"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../unierp-web
      args:
        <<: *registry
        API_URL: http://api:3001
        IDP_URL: http://idp:3005
    container_name: unerp-web
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_URL: http://api:3001
      IDP_URL: http://idp:3005
      NEXT_PUBLIC_API_URL: ""
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-super-secret-key-change-in-production}
    ports:
      - "3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started
      idp:
        condition: service_started

  console:
    build:
      context: ../unierp-console
      args:
        <<: *registry
        API_URL: http://api:3001
        IDP_URL: http://idp:3005
    container_name: unerp-console
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_URL: http://api:3001
      IDP_URL: http://idp:3005
      NEXT_PUBLIC_API_URL: ""
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-your-super-secret-key-change-in-production}
    ports:
      - "3002:3002"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started
      idp:
        condition: service_started

  marketing:
    build:
      context: ../unierp-corporate-website
    container_name: unerp-marketing
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "3003"
      DATABASE_URL: postgresql://unerp:unerp_password@postgres:5432/unerp_marketing?schema=public
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_ERP_APP_URL: http://localhost:3000
    ports:
      - "3003:3003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy

  developer:
    build:
      context: ../unierp-developer
      args:
        <<: *registry
        API_URL: http://api:3001
    container_name: unerp-developer
    restart: unless-stopped
    environment:
      NODE_ENV: development
      API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: ""
    ports:
      - "3004:3004"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started

  mobile:
    build:
      context: ../unierp-mobile
      args:
        API_BASE_URL: http://api:3001
    container_name: unerp-mobile
    restart: unless-stopped
    ports:
      - "3006:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      api:
        condition: service_started

  storybook:
    build:
      context: ../unierp-storybook
      args: *registry
    container_name: unerp-storybook
    restart: unless-stopped
    ports:
      - "6006:6006"
    extra_hosts:
      - "host.docker.internal:host-gateway"
